
name: SQL Business Logic Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-sql:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SQL Server tools
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Wait for SQL Server
        env:
          SQL_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          for i in {1..30}; do
            if /opt/mssql-tools18/bin/sqlcmd \
              -S localhost,1433 -U sa -P "$SQL_PASSWORD" \
              -C -b -Q "SELECT 1"; then
              exit 0
            fi
            sleep 2
          done

          echo "SQL Server failed to start."
          exit 1

      - name: Run Business Logic script
        env:
          SQL_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 -U sa -P "$SQL_PASSWORD" \
            -C -b -V 16 \
            -i "DBI202_SE2005_Group5_R5_BusinessLogic.sql"

      - name: Run Business Logic tests
        env:
          SQL_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 -U sa -P "$SQL_PASSWORD" \
            -C -b -V 16 \
            -i "DBI202_SE2005_Group5_R5_Test.sql"

      - name: Report success
        if: success()
        run: echo "Business Logic tests completed successfully."
